name: Mobile Showcase Screenshots

on:
  workflow_call:
    inputs:
      build_only:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      platform:
        description: Device platforms to capture
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      appearance:
        description: System appearances to capture
        required: true
        default: both
        type: choice
        options:
          - both
          - dark
          - light
      theme:
        description: Palette to capture (all multiplies the run by six)
        required: true
        default: vibe-codinger
        type: choice
        options:
          - vibe-codinger
          - vc-chat
          - grove
          - ocean
          - ember
          - iris
          - all

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  ios:
    name: iPhone, iPhone Duo, and iPad 13
    if: ${{ !inputs.build_only && (inputs.platform == 'all' || inputs.platform == 'ios') }}
    runs-on: blacksmith-12vcpu-macos-27
    # Capturing every palette multiplies the device matrix by six, and only the
    # one native build is shared between them.
    timeout-minutes: ${{ inputs.theme == 'all' && 300 || 60 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@vibecodinger/mobile...
              - --filter=@vibecodinger/scripts...
              - --filter=vibecodinger...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Install AXe
        # Locks the simulator and answers the notification prompt for the
        # agent-activity scene.
        # Homebrew refuses third-party tap formulae until they are trusted;
        # older releases have no trust command and install them as is.
        run: |
          brew tap cameroncooke/axe
          if brew commands | grep -qx trust; then brew trust --formula cameroncooke/axe/axe; fi
          brew install cameroncooke/axe/axe
          axe --version

      - name: Install foldable simulator controls
        run: npm install --global agent-device@0.21.41

      - name: Identify the simulator toolchain
        id: xcode
        run: |
          set -euo pipefail
          fingerprint=$( { xcodebuild -version; xcrun --sdk iphonesimulator --show-sdk-build-version; pod --version; } | shasum -a 256 | cut -d ' ' -f 1 )
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache iOS showcase dependencies and compilation results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          CACHE_PREFIX: ios-showcase-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.fingerprint }}-${{ hashFiles('pnpm-lock.yaml') }}-
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/.showcase/ios-derived-data/CompilationCache.noindex
          key: ${{ env.CACHE_PREFIX }}${{ hashFiles('apps/mobile/app.config.ts', 'apps/mobile/plugins/**', 'apps/mobile/modules/**/ios/**', 'apps/mobile/modules/**/*.podspec') }}
          restore-keys: ${{ env.CACHE_PREFIX }}

      - name: Capture iOS showcase
        run: pnpm screenshots:mobile --platform ios --appearance "${{ inputs.appearance }}" --theme "${{ inputs.theme }}"

      - name: Validate App Store Connect assets
        run: pnpm screenshots:mobile --platform ios --appearance "${{ inputs.appearance }}" --theme "${{ inputs.theme }}" --validate-only

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-store-connect-screenshots
          path: artifacts/app-store/screenshots/apple/
          if-no-files-found: warn
          retention-days: 14

  android:
    name: ${{ inputs.build_only && 'Android debug APK (arm64)' || 'Android phone, 7-inch tablet, and 10-inch tablet' }}
    if: inputs.build_only && github.ref == 'refs/heads/main' || !inputs.build_only && (inputs.platform == 'all' || inputs.platform == 'android')
    runs-on: ${{ inputs.build_only && 'ubuntu-24.04' || 'blacksmith-16vcpu-ubuntu-2404' }}
    # Capturing every palette multiplies the device matrix by six, and only the
    # one native build is shared between them.
    timeout-minutes: ${{ inputs.theme == 'all' && 300 || 60 }}
    env:
      VIBECODINGER_SHOWCASE_ANDROID_ABI: ${{ inputs.build_only && 'arm64-v8a' || 'x86_64' }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 512M
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@vibecodinger/mobile...
              - --filter=@vibecodinger/scripts...
              - --filter=vibecodinger...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: false

      - name: Set up ccache
        id: ccache
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/android-ccache" >> "$GITHUB_ENV"
          if ! command -v ccache >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi

      - name: Cache Android C and C++ compilation results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          CACHE_PREFIX: android-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.VIBECODINGER_SHOWCASE_ANDROID_ABI }}-${{ hashFiles('pnpm-lock.yaml') }}-
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CACHE_PREFIX }}${{ hashFiles('apps/mobile/app.config.ts', 'apps/mobile/plugins/**', 'apps/mobile/modules/**/android/**', 'apps/mobile/modules/**/cpp/**') }}
          restore-keys: ${{ env.CACHE_PREFIX }}

      - name: Generate Android build project
        if: inputs.build_only
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo prebuild --clean --platform android --no-install

      - name: Build Android APK
        if: inputs.build_only
        working-directory: apps/mobile/android
        env:
          APP_VARIANT: production
          EXPO_NO_TELEMETRY: "1"
        run: ./gradlew app:assembleDebug --build-cache "-PreactNativeArchitectures=$VIBECODINGER_SHOWCASE_ANDROID_ABI"

      - name: Upload Android APK
        if: inputs.build_only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-arm64-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Enable KVM
        if: ${{ !inputs.build_only }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Android showcase
        if: ${{ !inputs.build_only }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: Pixel_10_Pro
          cores: 8
          ram-size: 4096M
          disable-animations: false
          script: pnpm screenshots:mobile --platform android --appearance "${{ inputs.appearance }}" --theme "${{ inputs.theme }}"

      - name: Report Android native cache statistics
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        run: ccache --show-stats

      - name: Validate Google Play assets
        if: ${{ !inputs.build_only }}
        run: pnpm screenshots:mobile --platform android --appearance "${{ inputs.appearance }}" --theme "${{ inputs.theme }}" --validate-only

      - name: Upload Android screenshots
        if: ${{ always() && !inputs.build_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: google-play-screenshots
          path: artifacts/app-store/screenshots/google-play/
          if-no-files-found: warn
          retention-days: 14
