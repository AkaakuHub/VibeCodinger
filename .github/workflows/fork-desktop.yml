name: Fork desktop packages

on:
  workflow_call:
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      MACOS_PROVISIONING_PROFILE:
        required: false
    outputs:
      version:
        value: ${{ jobs.bundle.outputs.version }}

permissions:
  actions: read
  contents: read

jobs:
  bundle:
    if: >-
      github.repository == 'AkaakuHub/VibeCodinger' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git fetch --no-tags --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile --filter=vibecodinger... --filter=@vibecodinger/web... --filter=@vibecodinger/desktop... --filter=@vibecodinger/scripts...

      - name: Upload dependency verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          retention-days: 2

      - name: Set package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sh .github/scripts/fork-release-version.sh)"
          node scripts/update-release-package-versions.ts "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build desktop and server bundles
        env:
          VIBECODINGER_RELEASE_BUILD: "1"
        run: vp run build:desktop:bundle

      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  package:
    name: ${{ matrix.label }}
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            target: AppImage
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
          - label: macOS x64
            runner: macos-26-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - label: Windows x64
            runner: ubuntu-24.04
            verify_runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
          - label: Windows arm64
            runner: ubuntu-24.04
            verify_runner: windows-11-arm
            platform: win
            target: nsis
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            resource_key: win32-arm64
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
      APPLE_API_KEY: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
      APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
      MACOS_PROVISIONING_PROFILE: ${{ matrix.platform == 'mac' && secrets.MACOS_PROVISIONING_PROFILE || '' }}
    with:
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      verify_runner: ${{ matrix.verify_runner || '' }}
      cli_archive: ${{ matrix.platform != 'mac' }}
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: fork
      artifact_retention_days: 7
