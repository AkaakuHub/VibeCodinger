name: Build and publish VibeCodinger

on:
  workflow_call:
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      MACOS_PROVISIONING_PROFILE:
        required: false

permissions: {}

concurrency:
  group: fork-build-and-publish
  cancel-in-progress: true

jobs:
  desktop:
    if: &release_source >-
      github.event_name == 'push' && github.repository == 'AkaakuHub/VibeCodinger' &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/fork-desktop.yml
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
    permissions:
      actions: read
      contents: read

  ios:
    if: *release_source
    uses: ./.github/workflows/fork-ios-ipa.yml
    permissions:
      contents: read

  android:
    if: *release_source
    uses: ./.github/workflows/fork-android.yml
    permissions:
      contents: read

  update-manifests:
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile --filter=@vibecodinger/scripts...

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: update-manifest-*
          merge-multiple: true
          path: update-manifests

      - name: Prepare update manifests
        run: |
          node scripts/merge-release-update-manifests.ts update-manifests
          for manifest in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
            test -s "update-manifests/$manifest"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merged-update-manifests
          path: update-manifests/*.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [desktop, ios, android, update-manifests]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{desktop-*,cli-*,unsigned-iphone-ipa,android-arm64-debug-apk,merged-update-manifests}"
          path: packages

      - name: Publish the current build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.desktop.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]]; then
            echo '::error::main advanced during the build. Publish a build from its current commit.'
            exit 1
          fi

          (
            cd packages/unsigned-iphone-ipa
            sha256sum --check VibeCodinger-unsigned.ipa.sha256
          )
          mkdir release-assets
          cp packages/unsigned-iphone-ipa/VibeCodinger-unsigned.ipa{,.sha256} release-assets/
          cp packages/android-arm64-debug-apk/app-debug.apk release-assets/VibeCodinger-android-arm64.apk
          cp packages/merged-update-manifests/*.yml release-assets/
          for target in linux-x64 linux-arm64 mac-x64 mac-arm64 win-x64 win-arm64; do
            for file in "packages/desktop-$target"/*; do
              [[ "$file" == *.yml ]] && continue
              dest="release-assets/${file##*/}"
              test ! -e "$dest"
              cp "$file" "$dest"
            done
          done
          for target in linux-x64 linux-arm64 win-x64 win-arm64; do
            for file in "packages/cli-$target"/*; do
              dest="release-assets/${file##*/}"
              test ! -e "$dest"
              cp "$file" "$dest"
              (cd release-assets && sha256sum "${file##*/}") >> release-assets/SHA256SUMS
            done
          done

          tag="v$VERSION"
          printf -v notes 'Built from `%s`. The iPhone IPA requires signing before installation.' "$GITHUB_SHA"
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" \
            --latest --title "VibeCodinger $VERSION" --notes "$notes"
