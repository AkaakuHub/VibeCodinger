name: Build and publish VibeCodinger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages as a GitHub release
        type: boolean
        default: true

permissions: {}

concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_sha == github.sha)
        && 'fork-build-and-publish' || github.run_id }}
  cancel-in-progress: true

jobs:
  desktop:
    if: &release_source >-
      github.repository == 'AkaakuHub/VibeCodinger' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_sha == github.sha)
    uses: ./.github/workflows/fork-desktop.yml
    permissions:
      actions: read
      contents: read

  ios:
    if: *release_source
    uses: ./.github/workflows/fork-ios-ipa.yml
    permissions:
      contents: read

  android:
    if: *release_source
    uses: ./.github/workflows/mobile-showcase-screenshots.yml
    with:
      build_only: true
    permissions:
      contents: read

  publish:
    if: github.event_name == 'workflow_run' || inputs.publish
    needs: [desktop, ios, android]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{desktop-*,cli-*,unsigned-iphone-ipa,android-arm64-debug-apk}"
          path: packages

      - name: Publish the current build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.desktop.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]]; then
            echo '::error::main advanced during the build. Publish a build from its current commit.'
            exit 1
          fi

          (
            cd packages/unsigned-iphone-ipa
            sha256sum --check VibeCodinger-unsigned.ipa.sha256
          )
          mkdir release-assets
          cp packages/unsigned-iphone-ipa/VibeCodinger-unsigned.ipa{,.sha256} release-assets/
          cp packages/android-arm64-debug-apk/app-debug.apk release-assets/VibeCodinger-android-arm64.apk
          for target in linux-x64 linux-arm64 mac-x64 mac-arm64 win-x64 win-arm64; do
            for file in "packages/desktop-$target"/*; do
              dest="release-assets/${file##*/}"
              test ! -e "$dest"
              cp "$file" "$dest"
            done
          done
          for target in linux-x64 linux-arm64 win-x64 win-arm64; do
            for file in "packages/cli-$target"/*; do
              dest="release-assets/${file##*/}"
              test ! -e "$dest"
              cp "$file" "$dest"
            done
          done

          tag="vibecodinger-build-${GITHUB_SHA:0:12}"
          printf -v notes 'Built from `%s`. The iPhone IPA requires signing before installation.' "$GITHUB_SHA"
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" \
            --latest --title "VibeCodinger $VERSION" --notes "$notes"
